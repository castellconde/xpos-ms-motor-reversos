# =========================================================================================
# Configuración Externalizada - Motor Genérico de Transacciones y Reversos POS en ARO
# Cumple reglas de configuración segura: sin secretos hardcodeados, inyección por variables de entorno
# =========================================================================================

quarkus.application.name=piloto-motor-reversos-aro
quarkus.http.port=${XPOS_HTTP_PORT:8080}

# Documentación OpenAPI / Swagger UI
quarkus.smallrye-openapi.info-title=Plataforma de Integración POS en ARO - Motor de Reversos (Piloto Op1 / Op3)
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.info-description=API de Fachada POS, Motor Genérico de Transacciones, Soporte DLQ y Mantenimiento de Bitácora Particionada PCI-DSS
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/q/swagger-ui

# Parámetros del Motor Genérico y Resilience4j
xpos.despliegue.perfil=${XPOS_PERFIL_DESPLIEGUE:Op3-Hibrido-AzureFlexiblePG}
xpos.motor.reintentos-inmediatos.max=${XPOS_REINTENTOS_INMEDIATOS_MAX:2}
xpos.motor.circuit-breaker.sliding-window-size=${XPOS_CB_WINDOW_SIZE:4}
xpos.motor.circuit-breaker.minimum-calls=${XPOS_CB_MIN_CALLS:2}
xpos.motor.circuit-breaker.wait-open-ms=${XPOS_CB_WAIT_OPEN_MS:3000}

# Configuración de Base de Datos PostgreSQL (Desactivada en test/standalone sin Docker, activa en perfiles op1 y op3)
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${XPOS_DB_JDBC_URL:jdbc:postgresql://localhost:5432/xpos_reversos}
quarkus.datasource.username=${XPOS_DB_USER:xpos_app}
quarkus.datasource.password=${XPOS_DB_PASSWORD:changeit_in_env}
quarkus.datasource.active=false
quarkus.datasource.devservices.enabled=false
quarkus.devservices.enabled=false
quarkus.flyway.migrate-at-start=false

# -----------------------------------------------------------------------------------------
# Perfil Op1: Todo dentro del clúster ARO (Kafka + CloudNativePG dentro de la misma red)
# -----------------------------------------------------------------------------------------
%op1.xpos.despliegue.perfil=Op1-TodoEnARO-CloudNativePG
%op1.quarkus.datasource.active=true
%op1.quarkus.datasource.jdbc.url=${XPOS_DB_JDBC_URL:jdbc:postgresql://postgres-aro-op1:5432/xpos_reversos}
%op1.quarkus.flyway.migrate-at-start=true

# -----------------------------------------------------------------------------------------
# Perfil Op3 (Recomendado): Híbrido - Kafka + Quarkus en ARO, PostgreSQL Flexible en Azure
# -----------------------------------------------------------------------------------------
%op3.xpos.despliegue.perfil=Op3-Hibrido-AzureFlexiblePG
%op3.quarkus.datasource.active=true
%op3.quarkus.datasource.jdbc.url=${XPOS_DB_JDBC_URL:jdbc:postgresql://postgres-azure-flexible-op3:5432/xpos_reversos?sslmode=prefer}
%op3.quarkus.flyway.migrate-at-start=true

# -----------------------------------------------------------------------------------------
# Perfil Test (JUnit 5 / RestAssured sin requerir Docker daemon activo)
# -----------------------------------------------------------------------------------------
%test.xpos.despliegue.perfil=Test-Piloto-Local
%test.quarkus.datasource.active=false
%test.quarkus.flyway.migrate-at-start=false
%test.xpos.motor.reintentos-inmediatos.max=2
%test.xpos.motor.circuit-breaker.sliding-window-size=4
%test.xpos.motor.circuit-breaker.minimum-calls=2
%test.xpos.motor.circuit-breaker.wait-open-ms=1000
